<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>MyEnergy - Azienda Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Copia esattamente tutto lo stile di dashboard.html qui (è identico), ma cambia il --primary in #3b82f6 */
        :root { --primary: #3b82f6; --dark-bg: #0b0f1a; --panel-bg: #161e2d; --text-dim: #94a3b8; --success: #10b981; --danger: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--panel-bg); border-right: 1px solid #1f2937; padding: 25px; display: flex; flex-direction: column; z-index: 10;}
        .nav-item { padding: 15px; border-radius: 12px; color: var(--text-dim); cursor: pointer; transition: 0.3s; font-weight: 600; margin-bottom: 5px; display:flex; align-items:center; gap:10px;}
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; position:relative; }
        .section-view { display: none; animation: fadeIn 0.4s; }
        .section-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .top-bar { position: absolute; top: 30px; right: 40px; z-index: 100; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: var(--panel-bg); color: white; padding: 10px 20px; border-radius: 12px; border: 1px solid #2d3748; cursor: pointer; font-weight: bold; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: var(--panel-bg); min-width: 200px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid #2d3748; margin-top: 10px; overflow:hidden;}
        .dropdown-content div { color: white; padding: 15px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .dropdown-content div:hover { background-color: #1f2937; }
        .dropdown:hover .dropdown-content { display: block; }
        
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--panel-bg); border-radius: 20px; padding: 25px; border: 1px solid #2d3748; position:relative; }
        .clock-badge { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; font-family: monospace; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: var(--text-dim); font-size: 0.8rem; padding: 10px; border-bottom: 1px solid #2d3748; }
        td { padding: 15px 10px; border-bottom: 1px solid #1f2937; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color:var(--primary); margin-top:0;">🏢 CorpHub</h2>
        <div class="nav-item active" onclick="cambiaSezione('home', this)">📊 Global Overview</div>
        <div class="nav-item" onclick="cambiaSezione('ticket', this)">📩 IT & Ticket Manuali</div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="dropdown">
                <div class="dropbtn">👤 <span id="user-name">...</span> ▼</div>
                <div class="dropdown-content">
                    <div onclick="alert('Admin Pannello Dati')">⚙️ Impostazioni Sito B2B</div>
                    <div onclick="eseguiLogout()" style="color: #ef4444; border-top: 1px solid #2d3748;">🚪 Disconnetti</div>
                </div>
            </div>
        </div>

        <div id="sec-home" class="section-view active">
            <h1 style="margin-top:0;">Telemetry Hub B2B</h1>
            <div class="grid-stats" style="margin-top:30px;">
                <div class="card" style="background: linear-gradient(135deg, #1e1b4b, #0f172a); border-color:#8b5cf6;">
                    <div class="clock-badge" id="orologio-live">--:--:--</div>
                    <p style="color:var(--text-dim); font-size:0.8rem; font-weight:bold; margin:0;">CONDIZIONI SITO</p>
                    <div style="font-size:2.5rem; margin-top:10px;" id="meteo-icona">🌍</div>
                    <div style="font-size:1.8rem; font-weight:800;" id="meteo-temp">--°C</div>
                </div>
                <div class="card" style="border-left: 4px solid var(--primary);">
                    <p style="color:var(--text-dim); font-size:0.8rem; font-weight:bold; margin:0;">INVERTER CENTRALI</p>
                    <div style="font-size:1.5rem; font-weight:800; color:var(--primary); margin-top:10px;">48/48 Online</div>
                    <p style="font-size:0.85rem; color:var(--text-dim); margin:5px 0 0 0;">Nessun calo di tensione rilevato.</p>
                </div>
            </div>
        </div>

        <div id="sec-ticket" class="section-view">
            <h1>Gestione Anomalie</h1>
            <div class="card">
                <textarea id="t-testo" placeholder="Descrivi il problema tecnico..." style="width:100%; height:80px; background:#090c14; border:1px solid #2d3748; border-radius:10px; color:white; padding:15px; box-sizing:border-box; outline:none;"></textarea>
                <button onclick="mandaTicket()" style="margin-top:10px; background:var(--primary); border:none; color:white; padding:12px 25px; border-radius:10px; font-weight:bold; cursor:pointer;">🚀 Apri Ticket IT</button>
            </div>
            <table style="margin-top: 30px;">
                <thead><tr><th>Ticket ID</th><th>Problema</th><th>Stato</th></tr></thead>
                <tbody id="lista-ticket"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api";
        const session = JSON.parse(localStorage.getItem('myenergy_session'));
        if(!session || session.type !== 'azienda') window.location.href = 'index.html';
        else { document.getElementById('user-name').innerText = session.name; caricaTicket(); }

        setInterval(() => { document.getElementById('orologio-live').innerText = new Date().toLocaleTimeString('it-IT'); }, 1000);
        fetch('https://api.open-meteo.com/v1/forecast?latitude=45.46&longitude=9.19&current_weather=true') // Coordinate Milano
            .then(res => res.json()).then(data => { document.getElementById('meteo-temp').innerText = data.current_weather.temperature + '°C'; document.getElementById('meteo-icona').innerText = '☀️';});

        function cambiaSezione(id, el) {
            document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('sec-'+id).classList.add('active'); el.classList.add('active');
        }

        async function mandaTicket() {
            const txt = document.getElementById('t-testo').value; if(!txt) return;
            await fetch(`${API_URL}/tickets`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ azienda: session.name, testo: txt }) });
            document.getElementById('t-testo').value = ''; await caricaTicket();
        }

        async function caricaTicket() {
            const res = await fetch(`${API_URL}/tickets`); const tkts = await res.json();
            const myTkts = tkts.filter(t => t.azienda.includes(session.name));
            document.getElementById('lista-ticket').innerHTML = myTkts.reverse().map(t => `<tr><td><strong>${t.id}</strong></td><td>${t.testo}</td><td>${t.status}</td></tr>`).join('');
        }

        function eseguiLogout() { localStorage.removeItem('myenergy_session'); window.location.href = 'index.html'; }
    </script>
</body>
</html>
